services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: support_chat
    ports:
      - "55432:5432"
    volumes:
      - support_chat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d support_chat"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "local-dev-redis"]
    # App uses DB 0. Pytest defaults to REDIS_URL .../15 so FLUSHDB cannot wipe dev keys.
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-dev-redis", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      COOKIE_SECURE: "false"
      DATABASE_URL: postgresql+asyncpg://chat:chat@postgres:5432/support_chat
      REDIS_URL: redis://:local-dev-redis@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret-do-not-use-in-production-aaaaaaaa}
      WIDGET_TOKEN_SECRET: ${WIDGET_TOKEN_SECRET:-local-docker-widget-secret-do-not-use-in-production-bbbb}
      RATE_KEY_SECRET: ${RATE_KEY_SECRET:-local-docker-rate-secret-do-not-use-in-production-cccccc}
      STAFF_APP_ORIGIN: ${STAFF_APP_ORIGIN:-http://localhost:3000}
      WIDGET_ORIGIN: ${WIDGET_ORIGIN:-http://widget.localhost:3000}
      MARKETING_HOST_ORIGIN: ${MARKETING_HOST_ORIGIN:-http://host.localhost:3000}
      WIDGET_FRAME_ANCESTORS: ${WIDGET_FRAME_ANCESTORS:-http://localhost:3000,http://host.localhost:3000}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_TEMPERATURE: ${ANTHROPIC_TEMPERATURE:-0}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-250}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      OPENAI_EMBED_DIM: ${OPENAI_EMBED_DIM:-1536}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  support_chat_pg:
