<!doctype html>
<html lang="en">
  <head>
    <title>Script in answer</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [{
          "@type": "Question",
          "name": "How do I book?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Book online. <script>alert(1)</script>"
          }
        }]
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Booking</h1>
      <p>Use the clinic locator to schedule.</p>
    </main>
  </body>
</html>
