<!doctype html>
<html lang="en">
  <head>
    <title>SampleSite FAQs</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How quickly are drug screening results available?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most negative results are reported within 24-48 hours, and rapid testing can deliver negatives in minutes. Non-negatives go to a certified lab with MRO review before being reported."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <nav>Careers</nav>
    <main id="faq">
      <h1>FAQs</h1>
      <p>How quickly are drug screening results available?</p>
      <p>
        Most negative results are reported within 24-48 hours, and rapid testing can
        deliver negatives in minutes. Non-negatives go to a certified lab with MRO
        review before being reported.
      </p>
    </main>
  </body>
</html>
