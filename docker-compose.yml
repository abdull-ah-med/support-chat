# Local full stack (and base for EC2 prod overlay).
#   docker compose up --build
#
# Services: postgres, redis, backend (API + KB ingest), frontend
# Public URL on EC2: host nginx → 127.0.0.1:{3000,8000} (see docker-compose.prod.yml)

name: support-chat

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-admin-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-support_chat}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db-provision:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-admin-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-support_chat}
      APP_DB_USER: ${APP_DB_USER:-chat_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-chat-app}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-chat_migrator}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-local-chat-migrator}
    volumes:
      - ./deploy/provision-postgres-roles.sh:/provision-postgres-roles.sh:ro
    command: ["sh", "/provision-postgres-roles.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD:-local-dev-redis}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-dev-redis}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Explicit per service: the API never runs the background workers, the worker service does.
      # (The settings default is false, so nothing starts workers unless a service opts in.)
      ENABLE_BACKGROUND_WORKERS: "false"
      # Compose DNS overrides host-local URLs from backend/.env.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-chat_app}:${APP_DB_PASSWORD:-local-chat-app}@postgres:5432/${POSTGRES_DB:-support_chat}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis}@redis:6379/0
      APP_ENV: ${APP_ENV:-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WIDGET_TOKEN_SECRET: ${WIDGET_TOKEN_SECRET:?WIDGET_TOKEN_SECRET is required}
      RATE_KEY_SECRET: ${RATE_KEY_SECRET:?RATE_KEY_SECRET is required}
      WIDGET_CSP_SERVICE_SECRET: ${WIDGET_CSP_SERVICE_SECRET:?WIDGET_CSP_SERVICE_SECRET is required}
      STAFF_APP_ORIGIN: ${STAFF_APP_ORIGIN:-http://localhost:3000}
      WIDGET_ORIGIN: ${WIDGET_ORIGIN:-http://widget.localhost:3000}
      MARKETING_HOST_ORIGIN: ${MARKETING_HOST_ORIGIN:-http://host.localhost:3000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-30}
      RATE_WIDGET_CSP_IP: ${RATE_WIDGET_CSP_IP:-120}
      RATE_WIDGET_CSP_SITE: ${RATE_WIDGET_CSP_SITE:-3000}
      RATE_WIDGET_CSP_WINDOW: ${RATE_WIDGET_CSP_WINDOW:-60}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      OPENAI_EMBED_DIM: ${OPENAI_EMBED_DIM:-1536}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.parse import urlsplit; import urllib.request; from app.settings import get_settings; host=urlsplit(get_settings().staff_app_origin).netloc; request=urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host': host}); urllib.request.urlopen(request)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "/app/docker/migrate.sh"]
    # The image's HEALTHCHECK probes the API port; this one-shot container never serves it.
    healthcheck:
      disable: true
    environment:
      ENABLE_BACKGROUND_WORKERS: "false"
      DATABASE_URL: postgresql+asyncpg://${MIGRATION_DB_USER:-chat_migrator}:${MIGRATION_DB_PASSWORD:-local-chat-migrator}@postgres:5432/${POSTGRES_DB:-support_chat}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${MIGRATION_DB_USER:-chat_migrator}:${MIGRATION_DB_PASSWORD:-local-chat-migrator}@postgres:5432/${POSTGRES_DB:-support_chat}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WIDGET_TOKEN_SECRET: ${WIDGET_TOKEN_SECRET:?WIDGET_TOKEN_SECRET is required}
      RATE_KEY_SECRET: ${RATE_KEY_SECRET:?RATE_KEY_SECRET is required}
    depends_on:
      db-provision:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "app.workers.entrypoint"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENABLE_BACKGROUND_WORKERS: "true"
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-chat_app}:${APP_DB_PASSWORD:-local-chat-app}@postgres:5432/${POSTGRES_DB:-support_chat}
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis}@redis:6379/0
      APP_ENV: ${APP_ENV:-local}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WIDGET_TOKEN_SECRET: ${WIDGET_TOKEN_SECRET:?WIDGET_TOKEN_SECRET is required}
      RATE_KEY_SECRET: ${RATE_KEY_SECRET:?RATE_KEY_SECRET is required}
      WIDGET_CSP_SERVICE_SECRET: ${WIDGET_CSP_SERVICE_SECRET:?WIDGET_CSP_SERVICE_SECRET is required}
      STATUS_API_PROBE_URL: http://backend:8000/health
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import asyncio; from app.redis import get_redis; raise SystemExit(0 if asyncio.run(get_redis().get('worker:healthy')) == '1' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://backend:8000}
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
        NEXT_PUBLIC_WIDGET_ORIGIN: ${NEXT_PUBLIC_WIDGET_ORIGIN:-http://localhost:3000}
        NEXT_PUBLIC_STAFF_APP_ORIGIN: ${NEXT_PUBLIC_STAFF_APP_ORIGIN:-http://localhost:3000}
        NEXT_PUBLIC_MARKETING_HOST_ORIGIN: ${NEXT_PUBLIC_MARKETING_HOST_ORIGIN:-http://localhost:3000}
        NEXT_PUBLIC_DEMO_SITE_KEY: ${NEXT_PUBLIC_DEMO_SITE_KEY:-demo}
        NEXT_PUBLIC_DEMO_PUBLIC_KEY: ${NEXT_PUBLIC_DEMO_PUBLIC_KEY:-}
    environment:
      API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://backend:8000}
      WIDGET_CSP_SERVICE_SECRET: ${WIDGET_CSP_SERVICE_SECRET:?WIDGET_CSP_SERVICE_SECRET is required}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
