# Manual deploy (same OIDC → SSM path as CI/CD deploy-dev).
# Requires the canonical CI/CD workflow to have succeeded for this commit.
name: Deploy Dev

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::123456789012:role/github-actions-support-chat-dev-deploy-role
  EC2_INSTANCE_ID: i-08c9c4834a64d20fc
  DEPLOY_BRANCH: dev
  REPO_DIR: /home/ssm-user/support-chat
  CANONICAL_WORKFLOW: .github/workflows/ci-cd.yml

jobs:
  # AWS credentials are confined to this separate runner; builds receive public outputs only.
  build-env:
    name: Read optional public build environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      actions: read
      checks: read
    outputs:
      ready: ${{ steps.public-env.outcome }}
      platform: ${{ steps.public-env.outputs.platform }}
      API_ORIGIN: ${{ steps.public-env.outputs.API_ORIGIN }}
      NEXT_PUBLIC_API_ORIGIN: ${{ steps.public-env.outputs.NEXT_PUBLIC_API_ORIGIN }}
      NEXT_PUBLIC_WIDGET_ORIGIN: ${{ steps.public-env.outputs.NEXT_PUBLIC_WIDGET_ORIGIN }}
      NEXT_PUBLIC_STAFF_APP_ORIGIN: ${{ steps.public-env.outputs.NEXT_PUBLIC_STAFF_APP_ORIGIN }}
      NEXT_PUBLIC_MARKETING_HOST_ORIGIN: ${{ steps.public-env.outputs.NEXT_PUBLIC_MARKETING_HOST_ORIGIN }}
      NEXT_PUBLIC_DEMO_SITE_KEY: ${{ steps.public-env.outputs.NEXT_PUBLIC_DEMO_SITE_KEY }}
      NEXT_PUBLIC_DEMO_PUBLIC_KEY: ${{ steps.public-env.outputs.NEXT_PUBLIC_DEMO_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify CI checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          CANONICAL_WORKFLOW: ${{ env.CANONICAL_WORKFLOW }}
          VERIFY_SHA: ${{ github.sha }}
          VERIFY_REPO: ${{ github.repository }}
        run: bash deploy/verify-ci-checks.sh "$VERIFY_SHA" "$VERIFY_REPO"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        id: credentials
        continue-on-error: true
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read public build arguments from host
        id: public-env
        continue-on-error: true
        if: steps.credentials.outcome == 'success'
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
        run: bash deploy/read-build-env.sh

  # Separate runner: even build-action post hooks never receive AWS credentials or OIDC permission.
  build-images:
    name: Optional CI images
    needs: build-env
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' && steps.upload.outputs.artifact-id != '' }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build backend and frontend images (also worker and migrate)
        id: images
        continue-on-error: true
        timeout-minutes: 40
        if: needs.build-env.outputs.ready == 'success' && needs.build-env.outputs.platform == 'linux/amd64'
        env:
          API_ORIGIN: ${{ needs.build-env.outputs.API_ORIGIN }}
          NEXT_PUBLIC_API_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_API_ORIGIN }}
          NEXT_PUBLIC_WIDGET_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_WIDGET_ORIGIN }}
          NEXT_PUBLIC_STAFF_APP_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_STAFF_APP_ORIGIN }}
          NEXT_PUBLIC_MARKETING_HOST_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_MARKETING_HOST_ORIGIN }}
          NEXT_PUBLIC_DEMO_SITE_KEY: ${{ needs.build-env.outputs.NEXT_PUBLIC_DEMO_SITE_KEY }}
          NEXT_PUBLIC_DEMO_PUBLIC_KEY: ${{ needs.build-env.outputs.NEXT_PUBLIC_DEMO_PUBLIC_KEY }}
        run: |
          # Native amd64 build with the runner's Docker. Build args are passed by
          # name only so their values never pass through shell parsing.
          docker build --pull -t "supportchat-ci-backend:$GITHUB_SHA" ./backend
          docker build --pull -t "supportchat-ci-frontend:$GITHUB_SHA" \
            --build-arg API_ORIGIN \
            --build-arg NEXT_PUBLIC_API_ORIGIN \
            --build-arg NEXT_PUBLIC_WIDGET_ORIGIN \
            --build-arg NEXT_PUBLIC_STAFF_APP_ORIGIN \
            --build-arg NEXT_PUBLIC_MARKETING_HOST_ORIGIN \
            --build-arg NEXT_PUBLIC_DEMO_SITE_KEY \
            --build-arg NEXT_PUBLIC_DEMO_PUBLIC_KEY \
            ./frontend

      - name: Smoke imports and package images
        id: package
        continue-on-error: true
        timeout-minutes: 10
        if: steps.images.outcome == 'success'
        env:
          API_ORIGIN: ${{ needs.build-env.outputs.API_ORIGIN }}
          NEXT_PUBLIC_API_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_API_ORIGIN }}
          NEXT_PUBLIC_WIDGET_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_WIDGET_ORIGIN }}
          NEXT_PUBLIC_STAFF_APP_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_STAFF_APP_ORIGIN }}
          NEXT_PUBLIC_MARKETING_HOST_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_MARKETING_HOST_ORIGIN }}
          NEXT_PUBLIC_DEMO_SITE_KEY: ${{ needs.build-env.outputs.NEXT_PUBLIC_DEMO_SITE_KEY }}
          NEXT_PUBLIC_DEMO_PUBLIC_KEY: ${{ needs.build-env.outputs.NEXT_PUBLIC_DEMO_PUBLIC_KEY }}
        run: bash deploy/package-images.sh

      - name: Upload images (host build fallback on storage failure)
        id: upload
        if: steps.images.outcome == 'success' && steps.package.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: supportchat-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supportchat-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Deploy to EC2 (via SSM)
    # build-env runs the CI-checks gate first; a failed gate must stop the deploy even though
    # the optional image job (which needs it) is then skipped.
    needs: [build-env, build-images]
    if: always() && !cancelled() && needs.build-env.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command over SSM
        env:
          CI_UPLOAD_SUCCEEDED: ${{ needs.build-images.outputs.uploaded }}
          CI_ARTIFACT_ATTEMPT: ${{ needs.build-images.outputs.attempt }}
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
          BRANCH: ${{ env.DEPLOY_BRANCH }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO_DIR: ${{ env.REPO_DIR }}
          GITHUB_REPO: ${{ github.repository }}
          COMPOSE_APP_SERVICES: backend worker frontend
        run: |
          # Sender embeds this script verbatim. Pin only public artifact coordinates;
          # all existing token transport and fetch lines remain untouched.
          if [ "$CI_UPLOAD_SUCCEEDED" = true ]; then
            # The artifact was uploaded by the build job's attempt, which may differ from
            # this attempt when only the deploy job is re-run.
            [[ "$CI_ARTIFACT_ATTEMPT" =~ ^[0-9]+$ ]] || { echo "Invalid artifact attempt" >&2; exit 1; }
            sed -i "2i CI_ARTIFACT_RUN_ID=$GITHUB_RUN_ID\nCI_ARTIFACT_RUN_ATTEMPT=$CI_ARTIFACT_ATTEMPT" deploy/ssm-deploy.sh
          fi
          bash deploy/github-actions-ssm-deploy.sh

