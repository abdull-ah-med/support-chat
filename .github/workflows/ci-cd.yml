# Values here are read by GitHub Actions / deploy scripts via env — not hardcoded
# in shell scripts. Override per-environment with GitHub Environment variables
# or workflow `env:` if the AWS role/instance changes.

name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more (OIDC deploy, PR file listing) ask for it below.
permissions:
  contents: read

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::123456789012:role/github-actions-support-chat-dev-deploy-role
  EC2_INSTANCE_ID: i-08c9c4834a64d20fc
  DEPLOY_BRANCH: dev
  REPO_DIR: /home/ssm-user/support-chat
  # Must match the GitHub repo this workflow runs in.
  # GITHUB_REPOSITORY is set automatically; ssm deploy receives it as GITHUB_REPO.

jobs:
  # Decides which CI jobs are relevant. Skipped jobs (job-level `if`) report as
  # skipped, which GitHub treats as passing for required status checks.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci-cd.yml'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - '.env.example'
            backend:
              - *shared
              - 'backend/**'
            frontend:
              - *shared
              - 'frontend/**'

  backend-ci:
    name: Backend (lint + test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: support_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d support_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      # Dependency vulnerability audit of production packages. Non-blocking (continue-on-error).
      # PYSEC-2026-3740 (nltk, pulled in by crawl4ai) has no fixed release yet; drop the ignore once it does.
      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit --disable-pip --no-deps --ignore-vuln PYSEC-2026-3740 -r "$RUNNER_TEMP/requirements-audit.txt"

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/support_chat_test
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: "tttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttttt"
          WIDGET_TOKEN_SECRET: "wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"
          RATE_KEY_SECRET: "rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr"
          COOKIE_SECURE: "false"
          STAFF_APP_ORIGIN: http://localhost:3000
          WIDGET_ORIGIN: http://widget.localhost:3000
          MARKETING_HOST_ORIGIN: http://host.localhost:3000
        run: uv run pytest -n 4

  frontend-ci:
    name: Frontend (lint + typecheck + test + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production dependencies only: the remaining dev-only findings come from the shadcn CLI and have
      # no patched release. Non-blocking (continue-on-error).
      - name: Dependency audit (npm audit)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          API_ORIGIN: http://backend:8000
          NEXT_PUBLIC_WIDGET_ORIGIN: https://widget.placeholder.invalid
          NEXT_PUBLIC_STAFF_APP_ORIGIN: https://staff.placeholder.invalid
          NEXT_PUBLIC_MARKETING_HOST_ORIGIN: https://host.placeholder.invalid
          NEXT_PUBLIC_DEMO_SITE_KEY: demo
          NEXT_PUBLIC_DEMO_PUBLIC_KEY: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        run: npm run build

  # AWS credentials are confined to this separate runner; builds receive public outputs only.
  build-env:
    name: Read optional public build environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    outputs:
      ready: ${{ steps.public-env.outcome }}
      platform: ${{ steps.public-env.outputs.platform }}
      API_ORIGIN: ${{ steps.public-env.outputs.API_ORIGIN }}
      NEXT_PUBLIC_API_ORIGIN: ${{ steps.public-env.outputs.NEXT_PUBLIC_API_ORIGIN }}
      NEXT_PUBLIC_WIDGET_ORIGIN: ${{ steps.public-env.outputs.NEXT_PUBLIC_WIDGET_ORIGIN }}
      NEXT_PUBLIC_STAFF_APP_ORIGIN: ${{ steps.public-env.outputs.NEXT_PUBLIC_STAFF_APP_ORIGIN }}
      NEXT_PUBLIC_MARKETING_HOST_ORIGIN: ${{ steps.public-env.outputs.NEXT_PUBLIC_MARKETING_HOST_ORIGIN }}
      NEXT_PUBLIC_DEMO_SITE_KEY: ${{ steps.public-env.outputs.NEXT_PUBLIC_DEMO_SITE_KEY }}
      NEXT_PUBLIC_DEMO_PUBLIC_KEY: ${{ steps.public-env.outputs.NEXT_PUBLIC_DEMO_PUBLIC_KEY }}
    needs: [changes, backend-ci, frontend-ci]
    # always(): run even when a needed job was skipped by path filtering.
    # !failure() && !cancelled(): but never when any needed job failed/cancelled.
    if: >-
      always() && !failure() && !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/dev'
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: credentials
        continue-on-error: true
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read public build arguments from host
        id: public-env
        continue-on-error: true
        if: steps.credentials.outcome == 'success'
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
        run: bash deploy/read-build-env.sh

  # Separate runner: even build-action post hooks never receive AWS credentials or OIDC permission.
  build-images:
    name: Optional CI images
    needs: build-env
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' && steps.upload.outputs.artifact-id != '' }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend and frontend images (also worker and migrate)
        id: images
        continue-on-error: true
        timeout-minutes: 40
        if: needs.build-env.outputs.ready == 'success' && needs.build-env.outputs.platform == 'linux/amd64'
        env:
          API_ORIGIN: ${{ needs.build-env.outputs.API_ORIGIN }}
          NEXT_PUBLIC_API_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_API_ORIGIN }}
          NEXT_PUBLIC_WIDGET_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_WIDGET_ORIGIN }}
          NEXT_PUBLIC_STAFF_APP_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_STAFF_APP_ORIGIN }}
          NEXT_PUBLIC_MARKETING_HOST_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_MARKETING_HOST_ORIGIN }}
          NEXT_PUBLIC_DEMO_SITE_KEY: ${{ needs.build-env.outputs.NEXT_PUBLIC_DEMO_SITE_KEY }}
          NEXT_PUBLIC_DEMO_PUBLIC_KEY: ${{ needs.build-env.outputs.NEXT_PUBLIC_DEMO_PUBLIC_KEY }}
        run: |
          # Native amd64 build with the runner's Docker. Build args are passed by
          # name only so their values never pass through shell parsing.
          docker build --pull -t "supportchat-ci-backend:$GITHUB_SHA" ./backend
          docker build --pull -t "supportchat-ci-frontend:$GITHUB_SHA" \
            --build-arg API_ORIGIN \
            --build-arg NEXT_PUBLIC_API_ORIGIN \
            --build-arg NEXT_PUBLIC_WIDGET_ORIGIN \
            --build-arg NEXT_PUBLIC_STAFF_APP_ORIGIN \
            --build-arg NEXT_PUBLIC_MARKETING_HOST_ORIGIN \
            --build-arg NEXT_PUBLIC_DEMO_SITE_KEY \
            --build-arg NEXT_PUBLIC_DEMO_PUBLIC_KEY \
            ./frontend

      - name: Smoke imports and package images
        id: package
        continue-on-error: true
        timeout-minutes: 10
        if: steps.images.outcome == 'success'
        env:
          API_ORIGIN: ${{ needs.build-env.outputs.API_ORIGIN }}
          NEXT_PUBLIC_API_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_API_ORIGIN }}
          NEXT_PUBLIC_WIDGET_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_WIDGET_ORIGIN }}
          NEXT_PUBLIC_STAFF_APP_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_STAFF_APP_ORIGIN }}
          NEXT_PUBLIC_MARKETING_HOST_ORIGIN: ${{ needs.build-env.outputs.NEXT_PUBLIC_MARKETING_HOST_ORIGIN }}
          NEXT_PUBLIC_DEMO_SITE_KEY: ${{ needs.build-env.outputs.NEXT_PUBLIC_DEMO_SITE_KEY }}
          NEXT_PUBLIC_DEMO_PUBLIC_KEY: ${{ needs.build-env.outputs.NEXT_PUBLIC_DEMO_PUBLIC_KEY }}
        run: bash deploy/package-images.sh

      - name: Upload images (host build fallback on storage failure)
        id: upload
        if: steps.images.outcome == 'success' && steps.package.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: supportchat-images-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supportchat-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy-dev:
    name: Deploy to EC2 (via SSM)
    needs: [changes, backend-ci, frontend-ci, build-images]
    # Optional CI images never block deployment. Required CI failures still do.
    if: >-
      always() && !cancelled()
      && needs.changes.result == 'success'
      && (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped')
      && (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped')
      && github.event_name == 'push' && github.ref == 'refs/heads/dev'
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      AWS_REGION: us-east-2
      AWS_ROLE_ARN: arn:aws:iam::123456789012:role/github-actions-support-chat-dev-deploy-role
      EC2_INSTANCE_ID: i-08c9c4834a64d20fc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command over SSM
        env:
          CI_UPLOAD_SUCCEEDED: ${{ needs.build-images.outputs.uploaded }}
          CI_ARTIFACT_ATTEMPT: ${{ needs.build-images.outputs.attempt }}
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
          BRANCH: dev
          GITHUB_TOKEN: ${{ github.token }}
          REPO_DIR: /home/ssm-user/support-chat
          GITHUB_REPO: ${{ github.repository }}
          COMPOSE_APP_SERVICES: backend worker frontend
        run: |
          # Sender embeds this script verbatim. Pin only public artifact coordinates;
          # all existing token transport and fetch lines remain untouched.
          if [ "$CI_UPLOAD_SUCCEEDED" = true ]; then
            # The artifact was uploaded by the build job's attempt, which may differ from
            # this attempt when only the deploy job is re-run.
            [[ "$CI_ARTIFACT_ATTEMPT" =~ ^[0-9]+$ ]] || { echo "Invalid artifact attempt" >&2; exit 1; }
            sed -i "2i CI_ARTIFACT_RUN_ID=$GITHUB_RUN_ID\nCI_ARTIFACT_RUN_ATTEMPT=$CI_ARTIFACT_ATTEMPT" deploy/ssm-deploy.sh
          fi
          bash deploy/github-actions-ssm-deploy.sh

