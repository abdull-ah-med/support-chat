# INF-8: keep dependencies, base images and pinned action SHAs current. Pull requests only;
# nothing is merged automatically. Security updates are enabled separately in repo settings.
# Per ecosystem: one weekly PR for minor+patch, one for majors (at most 3 open), and a
# 5-day cooldown so brand-new releases are not proposed straight away.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
      python-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    ignore:
      # Types must track the Node runtime in frontend/Dockerfile (22 LTS), not the latest major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    # Majors first (first matching group wins); the catch-all also takes digest-only bumps,
    # which carry no semver update type.
    groups:
      docker-major:
        update-types: [major]
      docker-minor-patch-and-digest:
        patterns: ["*"]
    ignore:
      # Node LTS upgrades are deliberate (runtime, @types/node and CI move together).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  # Digest-pinned postgres/redis images in the compose files.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    # Majors first (first matching group wins); the catch-all also takes digest-only bumps,
    # which carry no semver update type.
    groups:
      compose-major:
        update-types: [major]
      compose-minor-patch-and-digest:
        patterns: ["*"]
    # PostgreSQL major upgrades require a deliberate data migration, never an image-only bump.
    ignore:
      - dependency-name: "pgvector/pgvector"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Redis majors change persistence/ACL/TLS behaviour; upgrade deliberately, not via bump.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
